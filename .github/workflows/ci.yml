name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (no --fix; CI must not rewrite)
        run: npx eslint src test
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
